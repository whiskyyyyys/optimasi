[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimasi-windows"
version = "2.1.1"
description = "Modern Windows 10/11 Performance, Laptop, Gaming, Privacy & Network Optimizer compiled with Python 3.11 + Nuitka"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "WhisXD" }]
dependencies = [
    "PySide6-Essentials>=6.7.0",
    "psutil>=5.9.8",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
build = [
    "nuitka>=2.4",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
optimasi = "optimasi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
